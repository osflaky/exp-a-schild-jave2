# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  workflow_dispatch:

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v5
    # The modules do not all target the same release, jave-core and the native
    # packages are on 8, jave-core-test-java11 on 11 and jave-example on 12, so
    # the jdk building them has to be at least as new as the highest of those.
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: ${{ matrix.distribution || 'temurin' }}
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
